[project]
name = "astra-med-backend"
version = "0.1.0"
description = "ASTRA-Med Core Backend & Mission Simulation Engine (NASA Space Apps Challenge - Team xterra)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "Pillow>=10.4.0",
    "numpy>=2.1.0",
    "opencv-python-headless>=4.10.0",
    "pytesseract>=0.3.13",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
