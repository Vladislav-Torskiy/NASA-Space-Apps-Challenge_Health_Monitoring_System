services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - SQLITE_DB_PATH=/app/data_db/astra_med.db
      - DATA_DIR=/app/data
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - astra_db:/app/data_db
      - ./data:/app/data:ro

  # Frontend service will be uncommented by Role 1 once Vite app is initialized in frontend/
  # frontend:
  #   image: node:20-alpine
  #   working_dir: /app
  #   command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./frontend:/app
  #   environment:
  #     - VITE_API_BASE_URL=http://localhost:8000
  #   depends_on:
  #     - backend

volumes:
  astra_db:
